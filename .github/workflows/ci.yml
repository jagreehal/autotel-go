name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint runs once, on the toolchain declared in go.mod. golangci-lint refuses to
  # start when it was built with an older Go than the target version, so running
  # it across the full test matrix breaks on the lowest supported version.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: `latest` silently moves across major versions and the config
          # schema is version-specific.
          version: v2.12.2
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.x', '1.26.x']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.go-version == '1.26.x'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      # Gates the release checklist in RELEASING.md, so it must fail the build.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Advisory only: gosec is noisy on instrumentation code and is reviewed by
      # hand rather than gating merges.
      - name: Run security scanner (advisory)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./... || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Build examples
        run: go build ./examples/...
